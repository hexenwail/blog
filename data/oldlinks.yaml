# Old-link map.
#
# Two decades of forum posts, wikis and bookmarks point at hexenworld.com and
# hexenworld.org paths. Both hosts are gone. Where we have an equivalent page we
# send people to it; where we do not, we send them to the Wayback capture rather
# than returning a 404. A dead link that explains itself beats a dead link.
#
#   from:    the legacy path, as it appeared on the old host
#   host:    which dead site it belonged to
#   to:      our equivalent page (omit if we have none)
#   wayback: capture URL, always recorded even when `to` is set
#   note:    what used to be there, in one line

- from: /h2entities/
  host: hexenworld.com
  to: /reference/
  wayback: "https://web.archive.org/web/2002/http://www.hexenworld.com/h2entities/"
  note: "~150-page hand-written Hexen II entity encyclopedia."

- from: /walk/
  host: hexenworld.com
  wayback: "https://web.archive.org/web/2001/http://www.hexenworld.com/walk/"
  note: "Walkthroughs for the retail campaign, plus cheats and secrets pages."

