categories:
  - id: engines
    name: Engines
    blurb: >
      Source ports. You need one of these plus your own retail game data.
      Lorem ipsum dolor sit amet, consectetur adipiscing elit.
  - id: tools
    name: Mapping & modding tools
    blurb: >
      Editors, compilers, model and archive utilities. Inky's toolbox, restated
      with checksums and mirrors.
  - id: mods
    name: Mods & total conversions
    blurb: >
      Gameplay modifications. Individual map packs live in the Maps & Mods database.
  - id: patches
    name: Patches & utilities
    blurb: >
      Small fixes, soundfonts, config bundles. Sed do eiusmod tempor incididunt.

