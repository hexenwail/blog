  related: [func_door_rotating, func_angletrigger, func_train_mp]
  example: |
    {
    "classname" "func_rotating"
    "speed" "45"
    "spawnflags" "1"
    }

- name: path_corner
  category: point
  games: [Hexen II, Portal of Praevus, HexenWorld]
  summary: A waypoint in a train's path.
  body: |
    Temporibus autem quibusdam et aut officiis. Chain them with `target`; the last one
    pointing back at the first makes a loop. `wait` pauses the train here.
  keys:
    - {key: targetname, type: string, default: "", desc: "Name the train or previous corner points at."}
    - {key: target, type: string, default: "", desc: "The next corner."}
    - {key: wait, type: float, default: "0", desc: "Seconds to pause here. -1 waits for a retrigger."}
  spawnflags: []
  related: [func_train_mp]
  example: |
    {
    "classname" "path_corner"
    "targetname" "barge_corner_1"
    "target" "barge_corner_2"
    "wait" "2"
    }

- name: trigger_multiple
  category: trigger
  games: [Hexen II, Portal of Praevus, HexenWorld]
  summary: A volume that fires every time it is entered.
  body: |
    Nam libero tempore, cum soluta nobis est eligendi. The general-purpose volume trigger.
    `wait` is the retrigger delay, not a duration, which trips people up constantly.
  keys:
    - {key: target, type: string, default: "", desc: "Fired on touch."}
    - {key: wait, type: float, default: "0.2", desc: "Seconds before it can fire again."}
    - {key: health, type: float, default: "0", desc: "If set, must be shot."}
    - {key: message, type: string, default: "", desc: "Centreprint shown on trigger."}
  spawnflags: []
  related: [trigger_once, trigger_secret, func_pressure]
  example: |
    {
    "classname" "trigger_multiple"
    "target" "ambush_spawn"
    "wait" "5"
    }

- name: trigger_once
  category: trigger
  games: [Hexen II, Portal of Praevus, HexenWorld]
  summary: A volume that fires exactly once.
  body: |
    Itaque earum rerum hic tenetur a sapiente delectus. Identical to trigger_multiple with
    a permanent latch. Use it for objective beats you do not want the player to farm.
  keys:
    - {key: target, type: string, default: "", desc: "Fired on first touch."}
    - {key: message, type: string, default: "", desc: "Centreprint shown on trigger."}
  spawnflags: []
  related: [trigger_multiple, trigger_secret]
  example: |
    {
    "classname" "trigger_once"
    "target" "objective_update_1"
    "message" "The seal is broken."
    }

- name: trigger_secret
  category: trigger
  games: [Hexen II, Portal of Praevus]
  summary: Increments the secret counter.
  body: |
    Ut aut reiciendis voluptatibus maiores. Hexen II does not surface secrets the way Quake
    does out of the box; the "Quake-style secrets" tutorial covers wiring the counter and
    the notification message.
  keys:
    - {key: message, type: string, default: "You found a secret!", desc: "Centreprint on discovery."}
    - {key: sounds, type: integer, default: "1", desc: "Notification sound."}
  spawnflags: []
  related: [trigger_once, func_door_secret]
  example: |
    {
    "classname" "trigger_secret"
    "message" "You found a secret!"
    }

- name: info_player_start
  category: point
  games: [Hexen II, Portal of Praevus, HexenWorld]
  summary: Single-player spawn point.
  body: |
    Omnis voluptas assumenda est. Exactly one per map, or the compiler complains and the
    engine picks arbitrarily. `angle` sets facing on spawn.
  keys:
    - {key: angle, type: float, default: "0", desc: "Facing on spawn."}
  spawnflags: []
  related: [info_player_deathmatch, info_player_coop]
  example: |
    {
    "classname" "info_player_start"
    "origin" "128 -64 32"
    "angle" "90"
    }

- name: light
  category: light
  games: [Hexen II, Portal of Praevus, HexenWorld]
  summary: A static light source, compiled into the lightmap.
  body: |
    Temporibus autem quibusdam. Compile-time only unless given a `targetname`, in which case
    the compiler emits a switchable style. Colour via `_color` where the compiler supports it.
  keys:
    - {key: light, type: float, default: "300", desc: "Brightness."}
    - {key: wait, type: float, default: "1", desc: "Falloff scale."}
    - {key: _color, type: vector, default: "1 1 1", desc: "RGB tint, ericw-tools extension."}
    - {key: style, type: integer, default: "0", desc: "Animation style index."}
    - {key: targetname, type: string, default: "", desc: "Makes the light switchable."}
  spawnflags: []
  related: [light_torch_small_walltorch, info_null]
  example: |
    {
    "classname" "light"
    "light" "220"
    "_color" "1.0 0.82 0.55"
    }
  ravenMaps:
    - {map: "keep1.bsp", count: 188}
    - {map: "cath.bsp", count: 241}
