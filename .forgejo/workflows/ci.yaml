name: build-and-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: docker
    steps:
      - uses: actions/checkout@v4

      - name: Install Hugo
        run: |
          HUGO_VERSION=0.163.3
          curl -sSL -o /tmp/hugo.tar.gz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf /tmp/hugo.tar.gz -C /usr/local/bin hugo
          hugo version

      - name: Build
        run: hugo --gc --cleanDestinationDir --printPathWarnings

      - name: Install checker deps
        run: pip install --quiet pyyaml

      # Offline checks: internal links, redirect targets, checksum presence,
      # and the age of every `verified:` date. Fails the build on any of them.
      - name: Link and consistency check
        run: python3 scripts/check-links.py --public public --max-age 180

      - name: Portable build still works from a subdirectory
        run: |
          HUGO_RELATIVEURLS=true hugo --gc --cleanDestinationDir
          python3 scripts/check-links.py --public public --max-age 180

  external-links:
    # Outbound link rot is checked on a schedule, not per-commit — a third-party
    # host being down should not block a docs typo from merging.
    runs-on: docker
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pyyaml
      - run: python3 scripts/check-links.py --public public --external || true
