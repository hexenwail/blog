# Canonical home. The site is reachable at other names, but every feed link,
# sitemap entry, canonical tag and generated redirect resolves against this one,
# so it is the address the site claims as its own.
baseURL = "https://hexenworld.org/"
locale = "en-us"
title = "Thyrion — a Hexen II community"
enableRobotsTXT = true
enableGitInfo = false

# Durability: no extension-less rot, no dates in evergreen paths.
uglyURLs = false

[params]
  # Keep the site out of search results while the prose is lorem ipsum, the
  # checksums are dummies and the download URLs say EXAMPLE. Being the top
  # result for "hexen 2 downloads" with placeholder data would be worse than
  # not being found at all — and the two hubs this replaces are remembered
  # partly for what stopped being true on them.
  #
  # Delete this line when the content is real. That is the whole switch.
  noindex = true
  description = "News, maps, mods, mapping documentation and preserved history for Hexen II."
  tagline = "The Serpent Riders are dead. The community is not."
  # Rendered in the footer so link-rot sweeps have a visible deadline.
  linksVerified = "2026-08-13"
  discord = "https://discord.gg/EXAMPLE"
  repo = "https://github.com/hexenwail/blog"

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false
  style = "dracula"
  lineNos = false

[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[taxonomies]
  tag = "tags"
  author = "authors"

# While the site stands in for the old Hammer of Thyrion home page, the menu
# mirrors that site's nav. The play/maps/modding/reference/community/archive
# sections still build and are still reachable by URL — they are just out of the
# menu until their content is real.
[menus]
  [[menus.main]]
    name = "News"
    pageRef = "/news"
    weight = 10
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 20
  [[menus.main]]
    name = "Features"
    pageRef = "/features"
    weight = 30
  [[menus.main]]
    name = "Downloads"
    pageRef = "/download"
    weight = 40
  [[menus.main]]
    name = "Links"
    pageRef = "/links"
    weight = 50
  [[menus.main]]
    name = "Search"
    pageRef = "/search"
    weight = 60

[[menus.footer]]
  name = "About"
  pageRef = "/about"
  weight = 10
[[menus.footer]]
  name = "Contribute"
  pageRef = "/contribute"
  weight = 20
[[menus.footer]]
  name = "News archive"
  pageRef = "/news"
  weight = 30
[[menus.footer]]
  name = "Old hexenworld links"
  pageRef = "/moved"
  weight = 40

# Build-time search index + server redirect rules, emitted from the home page.
[mediaTypes."text/netlify"]
  suffixes = []
[mediaTypes."text/apache"]
  suffixes = []

[outputFormats.SearchIndex]
  mediaType = "application/json"
  baseName = "search-index"
  isPlainText = true
  notAlternative = true
[outputFormats.Redirects]
  mediaType = "text/netlify"
  baseName = "_redirects"
  isPlainText = true
  notAlternative = true
[outputFormats.Htaccess]
  mediaType = "text/apache"
  baseName = ".htaccess"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["html", "rss", "SearchIndex", "Redirects", "Htaccess"]
  section = ["html", "rss"]

[services.rss]
  limit = -1
