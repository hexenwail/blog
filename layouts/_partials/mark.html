{{- /* Site mark: a coiled serpent, for the Serpent Riders. Inline SVG so it needs
       no font, no image request and no external asset, and it inherits currentColor
       so it tracks the theme automatically. */ -}}
<svg class="brand-mark" viewBox="0 0 32 32" width="26" height="26" aria-hidden="true" focusable="false">
  <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- outward coil, tightening toward the centre -->
    <path d="M16 3.5a12.5 12.5 0 1 0 12.5 12.5"/>
    <path d="M28.5 16a12.5 12.5 0 0 1-8 11.6"/>
    <path d="M16 8.6a7.4 7.4 0 1 1-7.4 7.4"/>
    <path d="M16 13.2a2.8 2.8 0 1 0 2.8 2.8"/>
  </g>
  <!-- head -->
  <circle cx="16" cy="3.5" r="2.4" fill="currentColor"/>
</svg>
